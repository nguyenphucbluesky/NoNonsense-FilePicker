apply plugin: 'com.android.library'
apply plugin: 'maven-publish'
apply plugin: 'signing'

android {
    namespace = "com.nononsenseapps.filepicker"
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        minSdk = 26
        targetSdk = 36

        versionCode 1
        versionName gitTag
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled = true
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.txt")
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
}

dependencies {
    implementation("com.google.android.material:material:1.14.0")

    testImplementation 'junit:junit:4.13.2'
}

task androidSourcesJar(type: Jar) {
    archiveClassifier.set('sources')
    from android.sourceSets.main.java.srcDirs
//    from android.sourceSets.main.kotlin.srcDirs
}

artifacts {
    archives androidSourcesJar
}

publishing {
    repositories {
        maven {
            name = "localFile"
            url = "file://${buildDir}/repo"
        }
        maven {
            name = "mavenCentral"
            url "https://oss.sonatype.org/service/local/staging/deploy/maven2"
            credentials {
                username findProperty("nexusUsername")
                password findProperty("nexusPassword")
            }
        }
    }
    publications {
        maven(MavenPublication) {
            groupId = 'com.nononsenseapps'
            artifactId = 'filepicker'
            version = gitTag

            artifact("$buildDir/outputs/aar/${project.getName()}-release.aar")
            artifact androidSourcesJar

            pom {
                name = "NoNonsense Filepicker"
                description = "An extendable Android file/directory-picker you can include in your app"
                url = "https://github.com/spacecowboy/NoNonsense-FilePicker"
                licenses {
                    license {
                        name = "Mozilla Public License Version 2.0"
                        url = "https://www.mozilla.org/en-US/MPL/2.0/"
                    }
                }
                scm {
                    connection = "scm:git:git://github.com/spacecowboy/NoNonsense-FilePicker.git"
                    developerConnection = "scm:git:ssh://git@github.com:spacecowboy/NoNonsense-FilePicker.git"
                    url = "https://github.com/spacecowboy/NoNonsense-FilePicker"
                }
//                withXml {
//                    def dependenciesNode = asNode().appendNode('dependencies')
//
//                    project.configurations.implementation.allDependencies.each {
//                        def dependencyNode = dependenciesNode.appendNode('dependency')
//                        dependencyNode.appendNode('groupId', it.group)
//                        dependencyNode.appendNode('artifactId', it.name)
//                        dependencyNode.appendNode('version', it.version)
//                    }
//                }
            }
        }
    }
}

signing {
    useGpgCmd()
    sign publishing.publications.maven
}
