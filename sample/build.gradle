apply plugin: 'com.android.application'

repositories {
    mavenCentral()
    google()
}

android {
    namespace = "com.nononsenseapps.filepicker.sample"
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    dataBinding {
        enabled = true
    }

    packagingOptions {
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
    }

    defaultConfig {
        minSdk = 26
        targetSdk = 36

        versionCode 1
        versionName gitTag
//        archivesBaseName = "nononsensefilepicker-sample-${gitTag}".toString()
        testInstrumentationRunner 'android.support.test.runner.AndroidJUnitRunner'
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
    }

    flavorDimensions "sdk"
    productFlavors {
        sample {
            dimension "sdk"
        }
        uitests {
            dimension "sdk"
            minSdkVersion 18
        }
    }

    buildTypes {
        release {
            release {
//                archivesBaseName = "nononsensefilepicker-sample-${gitTag}".toString()
                //minifyEnabled true
                //shrinkResources true
                //proguardFiles getDefaultProguardFile('proguard-android.txt')
            }
        }
    }
}

dependencies {
    implementation project(':library')

    implementation("com.google.android.material:material:1.14.0")

    // Image loading sample
    implementation 'com.github.bumptech.glide:glide:5.0.7'

    // FTP browser sample
    implementation 'commons-net:commons-net:3.13.0'

    // Root example
//    implementation 'eu.chainfire:libsuperuser:1.0.0.+'

    // Fast scroll example
    implementation 'com.simplecityapps:recyclerview-fastscroll:2.0.1'

    // Dropbox example
    implementation 'com.dropbox.core:dropbox-core-sdk:3.0.5'

    // UI Tests
    androidTestImplementation 'junit:junit:4.13.2'
    uitestsImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
    uitestsImplementation 'com.android.support.test:runner:1.0.2'
    uitestsImplementation 'com.android.support.test.espresso:espresso-contrib:3.0.2'
    uitestsImplementation 'com.android.support.test.uiautomator:uiautomator-v18:2.1.3'
}
